name: MCP Registry

# Publishes the MCP server (server.json) to the official MCP Registry as
# com.andrechek.room-planner/room-planner, with no manual step. The name is proven over HTTP: the registry
# fetches public/.well-known/mcp-registry-auth from room-planner.andrechek.com and checks it
# against a signature made with the MCP_REGISTRY_PRIVATE_KEY secret (docs/DEPLOY.md). Advisory
# only: not a required check (the ruleset requires just `ci`). Never name a job `ci`.
#
# A release is a bump of `version` in server.json (the one source: the Worker's serverInfo and
# server card read it). On main, the job skips a version the registry already has, waits until
# production serves that version and the committed proof record, then publishes. On pull
# requests it validates server.json and checks that the secret matches the committed record.
on:
  push:
    branches: [main]
    paths: &paths
      - 'server.json'
      - 'worker/**'
      - 'public/.well-known/mcp-registry-auth'
      - 'scripts/registry-key.mjs'
      - '.github/workflows/mcp-registry.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned release and its SHA-256 from that release's registry_<v>_checksums.txt.
  MCP_PUBLISHER_VERSION: v1.8.8
  MCP_PUBLISHER_SHA256: 09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4
  REGISTRY: https://registry.modelcontextprotocol.io
  DOMAIN: room-planner.andrechek.com
  SERVER_CARD: https://room-planner.andrechek.com/mcp/server-card
  PROOF_URL: https://room-planner.andrechek.com/.well-known/mcp-registry-auth

jobs:
  validate:
    name: validate server.json
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --retry 3 --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher --help > /dev/null

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      # Offline: derives the public record from the secret and compares it with the committed
      # file, printing neither. Secrets are not given to a fork's pull request; it then skips.
      - name: Check the signing key matches the committed proof record
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: node scripts/registry-key.mjs

  publish:
    name: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Read name and version
        id: meta
        run: |
          echo "name=$(jq -r .name server.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version server.json)" >> "$GITHUB_OUTPUT"

      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --retry 3 --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher --help > /dev/null

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Skip a version the registry already has
        id: published
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          name=$(jq -rn --arg n "$NAME" '$n|@uri')
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "${REGISTRY}/v0.1/servers/${name}/versions/${VERSION}")
          echo "registry answered ${status} for ${NAME} ${VERSION}"
          if [ "$status" = 200 ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME} ${VERSION} is already in the MCP Registry; nothing to publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for production to serve this version
        if: steps.published.outputs.already == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Workers Builds deploys main in a few minutes; the registry entry must not run ahead.
          for i in $(seq 1 60); do
            live=$(curl --silent --fail "${SERVER_CARD}" | jq -r .version || true)
            if [ "$live" = "$VERSION" ]; then echo "production serves ${VERSION}"; exit 0; fi
            echo "production serves '${live}', waiting for ${VERSION} (${i}/60)"
            sleep 20
          done
          echo "::error::Production did not serve ${VERSION} within 20 minutes; not publishing."
          exit 1

      - name: Wait for production to serve the committed proof record
        if: steps.published.outputs.already == 'false'
        run: |
          # The registry fetches it the same way (Accept: text/plain, no redirects followed).
          for i in $(seq 1 60); do
            if curl --silent --fail --max-redirs 0 -H 'Accept: text/plain' -A 'mcp-registry/1.0' \
                "${PROOF_URL}" | diff -q - public/.well-known/mcp-registry-auth > /dev/null; then
              echo "production serves the committed proof record"; exit 0
            fi
            echo "waiting for ${PROOF_URL} to match the committed file (${i}/60)"
            sleep 20
          done
          echo "::error::${PROOF_URL} does not serve the committed record; not publishing."
          exit 1

      - name: Check the signing key matches the committed proof record
        if: steps.published.outputs.already == 'false'
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: node scripts/registry-key.mjs

      # HTTP domain verification grants exactly com.andrechek.room-planner/*. Fallback without a
      # secret: rename server.json to io.github.EricAndrechek/room-planner and log in with
      # `./mcp-publisher login github-oidc`, with `id-token: write` added to this job's permissions.
      - name: Log in with HTTP domain verification
        if: steps.published.outputs.already == 'false'
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: ./mcp-publisher login http --domain "${DOMAIN}" --private-key "${MCP_REGISTRY_PRIVATE_KEY}"

      - name: Publish
        if: steps.published.outputs.already == 'false'
        run: ./mcp-publisher publish server.json
