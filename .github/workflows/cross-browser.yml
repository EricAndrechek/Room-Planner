name: Cross-browser

# Advisory only: NOT a required check (the ruleset requires just `ci`). Never name a job `ci`.
on:
  pull_request:
  schedule:
    - cron: '17 6 * * *' # daily, post-deploy smoke against production
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL to test (e.g. a Workers Builds preview). Empty = production.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: cross-browser-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  browsers:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: webkit
            browser: webkit
          - project: firefox
            browser: firefox
          - project: mobile-safari
            browser: webkit
          - project: mobile-chrome
            browser: chromium
    env:
      # PRs: empty -> Playwright builds and serves the local checkout. Otherwise the target URL.
      # (Not `pull_request && '' || ...`: '' is falsy in expressions, so that form always fell
      # through to production and PR runs never tested the PR.)
      E2E_BASE_URL: >-
        ${{ github.event_name != 'pull_request' &&
        (inputs.base_url || 'https://room-planner.andrechek.com') || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.pw.outputs.version }}

      # Downloads retried: a CDN/apt blip should not turn into a failure email.
      - name: Install Playwright ${{ matrix.browser }} (with system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            pnpm exec playwright install --with-deps ${{ matrix.browser }} && exit 0
            echo "::warning::playwright install failed (attempt $i), retrying"; sleep 20
          done
          exit 1

      - name: Install Playwright system deps only (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          for i in 1 2 3; do
            pnpm exec playwright install-deps ${{ matrix.browser }} && exit 0
            echo "::warning::playwright install-deps failed (attempt $i), retrying"; sleep 20
          done
          exit 1

      # Remote target (schedule/dispatch): ride out a brief outage or network blip before testing,
      # so only a site that stays down fails the run. Each failing test also gets one retry
      # (playwright.config.ts: retries 1 on CI); a test that passes on retry is reported as flaky,
      # not failed.
      - name: Wait for ${{ env.E2E_BASE_URL }} to respond
        if: env.E2E_BASE_URL != ''
        run: >-
          curl --fail --silent --show-error --location --output /dev/null
          --retry 6 --retry-all-errors --retry-delay 10 --max-time 30 "$E2E_BASE_URL"

      - name: Run e2e (${{ matrix.project }}) against ${{ env.E2E_BASE_URL || 'the local build' }}
        run: pnpm exec playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
