version: 2
updates:
  - package-ecosystem: npm # also covers pnpm lockfiles
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for all non-breaking updates; majors arrive individually.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 isn't supported by `astro check` / typescript-eslint yet. Remove once it is.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
